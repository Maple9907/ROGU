<script>
// ---- [GDD §27.2] validate-content: mở game với #validate để chạy; kết quả in ra màn hình + console ----
function validateContent(){const out=[],bad=[],ok=(n,c,m)=>{out.push((c?'✔ ':'✘ ')+n+(m?' — '+m:''));if(!c)bad.push(n)},
g=f=>{try{return f()}catch(e){return undefined}},cnt=(n,v,exp)=>v===undefined?out.push('? '+n+': không truy cập được từ ngoài (bỏ qua)'):ok(n,v==exp,v+'/'+exp);
const rl=g(()=>RL.length),tg=g(()=>window.TG),cd=g(()=>CD.length),sh=g(()=>SH.length),ev=g(()=>EV.length),ad=g(()=>AD.length),bo=g(()=>BOSS.length),bi=g(()=>BI.length),evr=g(()=>EVR);
// §00.3: số lượng nội dung launch
cnt('Relic',rl,60);cnt('Consumable',cd,10);cnt('Shrine',sh,8);cnt('Event',ev,12);cnt('Achievement',ad,30);cnt('Boss (5 + Vua Tro)',bo,6);cnt('Biome (5 + Trái Tim Tro)',bi,6);
// §27.2 #5: mỗi relic có tag hợp lệ
if(tg&&rl!==undefined){const V=new Set(['power','vitality','dash','crit','fire','defense','economy','frost','volt','venom','void','melee','projectile','parry','skill','aoe']);const miss=[],inv=[];for(let i=0;i<rl;i++){if(!tg[i])miss.push(i);else if(!V.has(tg[i]))inv.push(i+':'+tg[i])}ok('Mỗi relic có ≥1 tag',!miss.length,miss.length?'thiếu: '+miss.join(','):'');ok('Tag thuộc tập hợp lệ (16)',!inv.length,inv.join(' '))}
// §27.2 #1: Evolution tham chiếu relic tồn tại
if(evr&&rl!==undefined){const x=evr.filter(r=>!(r[0]>=0&&r[0]<rl&&r[1]>=0&&r[1]<rl&&r[0]!=r[1]));ok('Evolution trỏ tới relic hợp lệ',!x.length,evr.length+' công thức'+(x.length?', lỗi: '+x.map(r=>r[2]).join(', '):''));cnt('Evolution',evr.length,6)}
// §27.2 #3: frame vũ khí startup+active+recover ≥ 6, active ≥ 1
const fr=g(()=>[WD,CW]);if(fr){const e=[];let n=0;for(const T of fr)for(const k in T)for(const a of(T[k].F||[])){n++;if(!(a[1]>=1&&a[0]+a[1]+a[2]>=6))e.push(k+':'+a.join('/'))}ok('Frame đòn hợp lý ('+n+' đòn)',!e.length,e.join(' '))}else out.push('? Frame đòn: không truy cập được (bỏ qua)');
// §27.2 #6: mỗi biome có bộ địch riêng
const sk=g(()=>SKN);if(sk){ok('Bảng địch đủ 5 biome',sk.length==5,sk.length+'/5');sk.forEach((b,i)=>{let n=1;for(const k in b)n+=b[k].split(';').length;ok('Biome '+(i+1)+': 7 thường + 1 elite',n>=8,n+' (cần ≥8)')})}
// §27.2 #7: kích thước file
const kb=Math.round(document.documentElement.outerHTML.length/1024);ok('Kích thước trang ≤ 1.5 MB',kb<=1536,kb+' KB');
out.push('· Chưa tự kiểm được ở trình duyệt: telegraph theo từng đòn địch (nằm trong mã AI), đủ chuỗi VI+EN, Math.random trong sim.');
const r=out.join('\n');console.log(r);return{pass:!bad.length,failed:bad,report:r}}
window.validateContent=validateContent;
addEventListener('load',()=>{if(/validate/.test(location.hash)){const r=validateContent(),p=document.createElement('pre');p.style.cssText='position:fixed;inset:0;z-index:99;margin:0;padding:12px;overflow:auto;background:#0b0910;color:#e8e2f0;font:12px/1.5 monospace;white-space:pre-wrap';p.textContent=(r.pass?'TẤT CẢ ĐẠT':'CÓ '+r.failed.length+' MỤC LỖI')+'\n\n'+r.report;p.onclick=()=>p.remove();document.body.append(p)}});
</script>
<script>
// ---- [GDD §3/§11 GEN-02 + STR-01..07] Đồ thị biome 7 layer (L1..L7), cạnh đơn điệu, không quay lại ----
try{(()=>{
const _dg=doors;
function genGraph(bi){
  const q=rng(hash(G.seed+'g'+bi));
  const sizes=[1];
  for(let k=0;k<4;k++)sizes.push(q()<.45?3:2);
  sizes.push(1,1);
  const L=sizes.map((n,li)=>{const a=[];for(let k=0;k<n;k++){const lane=n==1?1:Math.round(k*2/(n-1));a.push({l:li,k,lane,ty:'c',rw:'',out:[],inn:[]})}return a});
  for(let li=0;li<6;li++){
    const A=L[li],B=L[li+1];let i=0,j=0;
    const link=()=>{if(A[i].out.indexOf(j)<0){A[i].out.push(j);B[j].inn.push(i)}};
    link();
    while(i<A.length-1||j<B.length-1){
      let mv;
      if(i==A.length-1)mv=1;else if(j==B.length-1)mv=0;else mv=(q()*3)|0;
      if(mv==0||mv==2)i++;if(mv==1||mv==2)j++;link();
    }
  }
  L[1].forEach((n,j)=>{if(L[0][0].out.indexOf(j)<0){L[0][0].out.push(j);n.inn.push(0)}});
  L[4].forEach((n,i)=>{if(n.out.indexOf(0)<0){n.out.push(0);L[5][0].inn.push(i)}});
  const mid=[].concat(L[1],L[2],L[3],L[4]);
  const vok=g=>{const all=[].concat(g[0],g[1],g[2],g[3],g[4],g[5],g[6]);const c=t=>all.filter(n=>n.ty==t).length;
    if(c('s')<1||c('v')<1||c('e')>2)return false;
    for(const n of all)for(const m of n.out){const t2=g[n.l+1][m],hv=x=>x=='s'||x=='e';if(hv(n.ty)&&hv(t2.ty))return false}
    for(const layer of g)if(layer.filter(n=>n.ty=='s').length>1)return false;
    return true};
  const place=(ty,a,b)=>{const c=mid.filter(n=>n.ty=='c'&&n.l+1>=a&&n.l+1<=b);if(!c.length)return false;c[(q()*c.length)|0].ty=ty;return true};
  for(let t=0;t<10;t++){
    mid.forEach(n=>n.ty='c');L[0][0].ty='c';L[5][0].ty='r';L[6][0].ty='b';
    place('s',3,5);place('v',2,5);
    const ne=bi==0?1:1+((q()*2)|0);
    for(let k=0;k<ne;k++)place('e',4,5);
    if(q()<.5)place('v',2,5);
    if(vok(L))break;
    if(t==9){mid.forEach(n=>n.ty='c');L[2][0].ty='s';L[1][0].ty='v';L[4][0].ty='e'}
  }
  for(const layer of L)for(const n of layer){
    if(n.ty=='c'){const z=q()*100;n.rw=z<20?'r':z<50?'g':z<65?'w':z<80?'k':z<95?'h':'q'}
    else if(n.ty=='e')n.rw='r';
  }
  return L;
}
window.genGraph=genGraph;
doors=function(i){
  if(!G||G.tr||G.ab||G.b==5)return _dg(i);
  if(!G.gr||G.grB!==G.b){G.gr=genGraph(G.b);G.grB=G.b}
  const L=G.gr,li=Math.min(Math.max(G.room|0,0),6),layer=L[li]||L[0];
  const me=layer[Math.min(G.nd|0,layer.length-1)]||layer[0];
  const nx=L[Math.min(li+1,6)];
  const ds=me.out.map(k=>{const t=nx[Math.min(k,nx.length-1)]||nx[0];return{t:t.ty,rw:t.rw,k}});
  if(hash(G.seed+G.b+'TR')%10<4&&(li+1)==2+hash(G.seed+G.b+'TN')%3){const d=ds[1];if(d&&d.t=='c'){d.t='t';d.rw='';d.k=G.nd|0}}
  return ds.length?ds:[{t:'b',rw:'',k:0}];
};
const _srG=startRoom;
startRoom=function(i,o){
  if(G&&G.b<5&&!G.tr&&!G.ab&&(!G.gr||G.grB!==G.b)){G.gr=genGraph(G.b);G.grB=G.b}
  if(G){
    if(o&&o.k!=null&&o.t!=='t')G.nd=o.k;else if(o&&o.t=='t')G.nd=0;else if(!o||G.nd==null)G.nd=0;
    if(G.nd==null)G.nd=0;
  }
  _srG(i,o);
  if(G){G.ph=G.ph||[];G.ph[G.room]=G.nd|0;if(S.run){S.run.nd=G.nd|0;S.run.ph=G.ph.filter(x=>Number.isInteger(x));save()}}
};
const _mp=mapOpen;
window.mapOpen=()=>{
  if(!G||G.tr)return;if(G.b==5)return _mp();
  if(G.st=='play')pause();if(G.st!='pause')return;
  if(!G.gr||G.grB!==G.b){G.gr=genGraph(G.b);G.grB=G.b}
  const L=G.gr;let h='<h1>Bản đồ · '+BI[G.b][0]+'</h1><div style="display:flex;gap:6px;flex-wrap:nowrap;justify-content:center">';
  for(let li=0;li<7;li++){
    h+='<div style="min-width:52px;padding:4px 2px;border:1px solid '+(li==G.room?'#ffd23b':'#463c52')+';border-radius:6px;opacity:'+(li<G.room?.55:1)+'"><small>L'+(li+1)+'</small>';
    for(const n of L[li]){
      const g=glyph({t:n.ty,rw:n.rw}),cur=li==G.room&&n.k==(G.nd|0),seen=li<G.room||(G.ph&&G.ph[li]==n.k);
      h+='<p style="font-size:17px;margin:2px 0;color:'+g[1]+';'+(cur?'outline:2px solid #ffd23b;border-radius:4px;':'')+(seen?'':'opacity:.85')+'">'+(seen?'✓':'')+g[0]+'</p>';
    }
    h+='</div>';
  }
  ov(h+'</div><small>✓ đã đi · viền vàng: đang đứng · ▣ rương · $ shop · ? event · ♨ lửa trại · ☠ elite/boss · ✦ relic · ◈ vàng · ⚒ đá mài · ✚ vật phẩm · ♥ hồi</small><div class=row><button class=b onclick=resume()>Tiếp tục</button><button class=b onclick="G.st=\'play\';pause()">◀ Quay lại</button></div>');
};
})()}catch(e){console.error('graph',e)}
</script>
<script>
// ---- Tự phục hồi Hub (§14.1): nếu script Hub không chạy lúc load, nạp lại nó sau khi trang xong ----
addEventListener('load',()=>{setTimeout(()=>{
try{
if(typeof window.hubSel==='undefined'){
  fetch(location.href.split('#')[0],{cache:'force-cache'}).then(r=>r.text()).then(html=>{
    const chunk=html.split('<script>').find(p=>p.indexOf('window.hub=hub')>=0&&p.indexOf('hubfix')<0);
    if(chunk){const el=document.createElement('script');el.textContent=chunk.split('<\/script>')[0];document.head.appendChild(el);if(typeof window.hub==='function')afterHub()}
  }).catch(()=>{});
}else afterHub();
function afterHub(){
if(typeof window.hub==='function'&&!/[#&](s|seed)=/.test(location.hash)){
  let hasRun=false;try{hasRun=!!JSON.parse(localStorage.getItem('ashbound_v1')||'{}').run}catch(e){}
  if(!hasRun&&typeof G!=='undefined'&&!G)window.hub();
}}
}catch(e){console.error('hubfix',e)}
},50)});
</script>
